# DISABLED. The quirk works — it is the only way this board holds a suspend at all — but suspend is
# not supported here, so nothing should be carrying its risk. One run with it active ended with the
# box hung (both LEDs off, power cut to recover), never reproduced, cause unknown.
#
# Measured while it was enabled, each step named by its btmon trace:
#   no quirk             2.8 s   woken by the remote's reconnect advert
#   quirk only          28.3 s   woken by Authenticated Payload Timeout Expired
#   quirk + page-2 mask 3598 s   woken when the remote drops its own link after ~1 h
#
# See the README beside this file for the two unfixed faults.
#options skwbt keep_link_suspended=1

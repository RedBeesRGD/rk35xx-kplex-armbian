# Arm the SoC watchdog (snps,dw-wdt @ ffac0000, enabled in board.dtb). systemd pings it from PID 1
# and the hardware resets the box if it stops. It cannot be stopped once armed and carries across a
# soft reboot, so take the largest step the hardware has: 80 rounds up to the 89 s step.
# To disable: set RuntimeWatchdogSec=off here, then systemctl daemon-reexec.
# Staged to /etc/systemd/system.conf.d/.
[Manager]
RuntimeWatchdogSec=80
